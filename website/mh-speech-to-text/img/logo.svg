  <path d="M190 110 h24" stroke="#ffffff" stroke-opacity="0.8" stroke-width="12" stroke-linecap="round"/>
  <path d="M182 140 h32" stroke="#ffffff" stroke-opacity="0.65" stroke-width="12" stroke-linecap="round"/>
